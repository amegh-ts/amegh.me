<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#e6edf6;
  background:
    radial-gradient(600px 300px at 85% 20%, rgba(56,189,248,.18), transparent 70%),
    radial-gradient(500px 300px at 45% 110%, rgba(129,140,248,.16), transparent 70%),
    #0b1220;}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(90deg,transparent 0%,#000 45%,#000 100%);}
.wrap{position:absolute;right:96px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:20px;color:#38bdf8;letter-spacing:.04em;margin-bottom:14px}
h1{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h1 span{background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;color:transparent}
.sub{font-size:24px;color:#9fb0c6;margin-top:14px;font-weight:500}
.pills{display:flex;gap:10px;margin-top:26px;justify-content:flex-end}
.pill{font-size:17px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.6);color:#cbd5e1}
.url{position:absolute;right:96px;bottom:28px;font-family:'JetBrains Mono',monospace;font-size:17px;color:#64748b}
</style></head><body>
<div class="grid"></div>
<div class="wrap">
  <div class="eyebrow">// full-stack developer</div>
  <h1>Building <span>payments, booking</span><br>&amp; admin systems that scale</h1>
  <div class="sub">Shipping end-to-end at Oppam — a mental health platform</div>
  <div class="pills">
    <div class="pill">Next.js</div><div class="pill">React</div><div class="pill">TypeScript</div><div class="pill">Node.js</div><div class="pill">PostgreSQL</div>
  </div>
</div>
<div class="url">oppam.com</div>
</body></html>
