<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  background:#fff;color:#111214;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:54px 64px 0;
  letter-spacing:-.018em;
}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid rgba(0,0,0,.12)}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-optical-sizing:auto;font-variation-settings:"opsz" 96,"wdth" 100;font-size:24px;font-weight:600;letter-spacing:-.035em}
.domain{font-size:19px;color:#6a6e78}
h1{
  margin-top:38px;
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-optical-sizing:auto;
  font-variation-settings:"opsz" 96,"wdth" 100;
  font-size:94px;line-height:.92;letter-spacing:-.045em;font-weight:600;
  white-space:nowrap;
}
h1 span{display:block}
.band{
  margin-top:auto;
  margin-left:-64px;margin-right:-64px;
  background:#f4e11b;color:#14130a;
  padding:20px 64px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.role{font-size:22px;font-weight:500;letter-spacing:-.025em}
.role b{font-weight:600}
.stack{font-size:18px;color:#54500f;letter-spacing:-.01em}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Amegh T S</div>
  <div class="domain">amegh.me</div>
</div>
<h1 aria-label="I build products end-to-end, from database to interface.">
  <span>I build products</span>
  <span>end-to-end,</span>
  <span>from database</span>
  <span>to interface.</span>
</h1>
<div class="band">
  <div class="role"><b>Full-stack developer</b> in Kerala, India</div>
  <div class="stack">Next.js · Node.js · PostgreSQL</div>
</div>
</body>
</html>
